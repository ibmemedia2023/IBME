<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" stroke-dasharray="16 10"/>
  <!-- Cross -->
  <g filter="url(#glow)">
    <rect x="226" y="100" width="60" height="312" rx="10" fill="#fef3c7"/>
    <rect x="136" y="190" width="240" height="60" rx="10" fill="#fef3c7"/>
  </g>
  <!-- Radiant Heart/Center -->
  <circle cx="256" cy="220" r="24" fill="url(#gold)"/>
  <!-- Light rays -->
  <path d="M256 50 L256 80 M256 432 L256 462 M50 256 L80 256 M432 256 L462 256" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
